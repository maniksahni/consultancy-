name: Redesign Build

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - codex/full-redesign-2026
      - codex/clean-premium-redesign-v2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
