name: Stage official institution updates
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/import-institutions.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: institution-staging-for-review
          path: data/staging/institutions.json
          retention-days: 30
# This job deliberately cannot publish source changes or deploy Hosting.
