name: Althéa quality gates
on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/althea-qa.yml"
      - "firebase.json"
      - "next.config.mjs"
  workflow_dispatch:
concurrency:
  group: althea-seo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-and-mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: node --check scripts/extract-france-sources.mjs
      - run: node --check scripts/serve-export.mjs
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Audit SEO, indexability and first-party performance budgets
        run: node scripts/check-seo-performance.mjs
      - name: Check official live registry API (nonblocking)
        continue-on-error: true
        run: node scripts/check-open-data-api.mjs
      - run: npx playwright install --with-deps chromium
      - name: Start Next.js and test 9 viewports
        run: |
          node scripts/serve-export.mjs > /tmp/althea-next.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          node scripts/check-althea-responsive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: althea-mobile-desktop-qa
          path: artifacts/qa
          retention-days: 14
      - name: Show server logs if tests failed
        if: failure()
        run: cat /tmp/althea-next.log || true
