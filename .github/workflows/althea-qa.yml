name: Althéa quality gates
on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/check-althea-responsive.mjs"
      - ".github/workflows/althea-qa.yml"
  workflow_dispatch:
jobs:
  build-and-mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start Next.js and test 9 viewports
        run: |
          npm run start > /tmp/althea-next.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          node scripts/check-althea-responsive.mjs
      - name: Show server logs if tests failed
        if: failure()
        run: cat /tmp/althea-next.log || true
